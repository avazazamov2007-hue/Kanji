<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanji O'rganish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --bar:#1a1a1a; --card:#161616; --card2:#1c1c1c; --line:#2a2a2a;
  --text:#e4e4e4; --dim:#8a8a8a; --accent:#ff5a5a; --good:#4ade80; --bad:#ff5a5a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text)}
body{font-family:'Cormorant Garamond','Noto Serif JP',serif;font-size:18px;touch-action:manipulation}
#app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.jp{font-family:'Noto Serif JP','Cormorant Garamond',serif}
.title{font-family:'Playfair Display',serif;font-weight:700}
svg.i{width:1em;height:1em;fill:currentColor;display:block}

.top{flex:none;background:var(--bar);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;font-size:20px;user-select:none}
.top svg{font-size:22px}

/* home */
.home{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:0 22px;text-align:center;gap:clamp(12px,3vh,26px)}
.home h1{font-size:clamp(34px,5.5vh,44px);line-height:1.15}
.home p.sub{color:var(--dim);font-size:clamp(17px,2.6vh,20px);margin-bottom:clamp(6px,3vh,28px)}
.big{background:linear-gradient(145deg,#1b1b1b,#0f0f0f);border:1px solid var(--line);border-radius:32px;padding:clamp(18px,4.5vh,40px) 20px;cursor:pointer;transition:transform .15s,border-color .2s}
.big:active{transform:scale(.97);border-color:#444}
.big .ic{width:clamp(52px,9vh,80px);height:clamp(52px,9vh,80px);border-radius:50%;background:#222;margin:0 auto clamp(10px,2vh,20px);display:flex;align-items:center;justify-content:center;font-size:clamp(22px,4vh,32px)}
.big h2{font-family:'Playfair Display',serif;font-size:clamp(22px,3.6vh,28px);margin-bottom:6px}
.big .jp{color:var(--dim);font-size:clamp(18px,3vh,24px)}

/* dictionary grid: 6 x 6 = 36 */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:8px;padding:14px 14px 18px}
.cell{min-height:0;background:var(--card2);border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:min(8vw,4.6vh);cursor:pointer;transition:transform .12s,border-color .2s,background .2s}
.cell:active{transform:scale(.92);border-color:var(--accent);background:#241616}

/* detail */
.det{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 18px 16px}
.dnav{flex:none;display:flex;justify-content:space-between;align-items:center}
.cnt2{color:var(--dim);font-size:20px}
.nav{width:44px;height:44px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.nav.r svg{transform:scaleX(-1)}
.bigk{flex:none;text-align:center;font-size:min(26vw,15vh);line-height:1.1;margin-top:2px}
.mean{flex:none;text-align:center;font-size:clamp(20px,3.4vh,26px);color:var(--accent);margin:2px 0 clamp(8px,1.8vh,16px);font-weight:600}
.row{flex:none;display:flex;gap:10px}
.box{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:8px 14px}
.box small{display:block;color:var(--dim);font-size:13px;letter-spacing:.6px;margin-bottom:2px;text-transform:uppercase}
.box .jp{font-size:clamp(17px,2.8vh,21px);line-height:1.35}
.wt{flex:none;color:var(--dim);font-size:13px;letter-spacing:.6px;text-transform:uppercase;margin:clamp(8px,1.8vh,16px) 0 2px}
.words{flex:1;min-height:0;display:flex;flex-direction:column}
.word{flex:1;min-height:0;display:flex;align-items:center;gap:14px;border-bottom:1px solid #222}
.word:last-child{border:none}
.word .w{width:36%;font-size:min(6vw,3.6vh);white-space:nowrap}
.word .d{display:flex;flex-direction:column;line-height:1.25}
.word .rd{font-size:min(4vw,2.4vh);color:#bbb;font-family:'Noto Serif JP',serif}
.word .mm{font-size:min(4.4vw,2.7vh);color:var(--dim)}

/* setup */
.wrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(10px,2vh,22px) 20px clamp(14px,3vh,28px)}
.label{color:var(--dim);font-size:clamp(18px,2.8vh,22px);margin:0 0 clamp(6px,1.4vh,12px) 4px}
.mode{display:flex;align-items:center;gap:18px;background:var(--card2);border:1px solid var(--line);border-radius:24px;padding:clamp(10px,2vh,18px) 20px;margin-bottom:clamp(8px,1.5vh,12px);cursor:pointer;transition:.2s;font-size:clamp(19px,3vh,24px)}
.mode .mi{width:clamp(44px,7vh,56px);height:clamp(44px,7vh,56px);border-radius:14px;background:#262626;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.mode.on{border-color:var(--accent);background:#1f1010}
.mode.on .mi{background:var(--accent);color:#111}
.counts{display:flex;gap:10px}
.cnt{flex:1;text-align:center;padding:clamp(14px,2.8vh,22px) 2px;background:var(--card2);border:1px solid var(--line);border-radius:18px;font-size:clamp(18px,2.8vh,22px);cursor:pointer;transition:.2s}
.cnt.on{background:var(--accent);border-color:var(--accent);color:#111}
.start{flex:none;width:100%;padding:clamp(16px,3vh,24px);border:none;border-radius:26px;background:#e0e0e0;color:#111;font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(22px,3.4vh,28px);cursor:pointer}
.start:active{transform:scale(.98)}

/* quiz */
.qtop{flex:none;display:flex;align-items:center;gap:16px;padding:12px 20px 0}
.prog{flex:1}
.bar{height:12px;border-radius:6px;background:#262626;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.cn{color:var(--dim);margin-top:4px;font-size:20px}
.score{display:flex;align-items:center;gap:8px;background:#12261c;color:var(--good);border-radius:30px;padding:10px 18px;font-size:20px;font-weight:600}
.score svg{font-size:20px}
.q{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 20px 14px}
.qp{flex:none;color:var(--dim);font-size:clamp(19px,3vh,24px);margin:clamp(6px,1.6vh,16px) 0 0}
.qk{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;font-size:min(30vw,19vh);line-height:1}
.opts{flex:none}
.opt{display:flex;align-items:center;gap:16px;background:var(--card2);border:1px solid var(--line);border-radius:24px;padding:0 18px;margin-bottom:clamp(7px,1.3vh,12px);cursor:pointer;font-size:clamp(20px,3.3vh,26px);transition:.15s;height:clamp(50px,8.6vh,74px)}
.opt .l{width:clamp(34px,5.4vh,44px);height:clamp(34px,5.4vh,44px);border-radius:50%;background:#2c2c2c;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;font-size:clamp(16px,2.4vh,20px);font-weight:600;flex:none}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--good);background:#10261a}
.opt.ok .l{background:var(--good);color:#0a0a0a}
.opt.no{border-color:var(--bad);background:#2a1212}
.opt.no .l{background:var(--bad);color:#0a0a0a}
.opt.lock{pointer-events:none}
.opt.dim{opacity:.45}
.next{flex:none;width:100%;height:clamp(48px,7.4vh,60px);border:none;border-radius:22px;background:#e0e0e0;color:#111;font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(19px,2.8vh,23px);cursor:pointer;visibility:hidden}
.next.show{visibility:visible}

/* result */
.res{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(18px,4vh,40px) 22px clamp(14px,3vh,28px);text-align:center}
.ring{flex:none;width:clamp(120px,22vh,180px);height:clamp(120px,22vh,180px);border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),#262626 0)}
.ring div{width:82%;height:82%;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column}
.ring b{font-family:'Playfair Display',serif;font-size:clamp(30px,5.4vh,44px)}
.res h2{font-family:'Playfair Display',serif;font-size:clamp(22px,3.8vh,30px);margin-bottom:4px}
.res p{color:var(--dim);font-size:clamp(17px,2.6vh,21px)}
.mist{flex:1;min-height:0;width:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.mist .label{text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-height:100%;overflow:hidden}
.chip{width:clamp(40px,6.4vh,52px);height:clamp(40px,6.4vh,52px);display:flex;align-items:center;justify-content:center;border:1px solid #5a2a2a;background:#241414;border-radius:12px;font-size:clamp(20px,3.4vh,28px)}
.btns{flex:none;width:100%;display:flex;gap:12px}
.btns button{flex:1;padding:clamp(14px,2.6vh,20px);border-radius:22px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-family:'Cormorant Garamond',serif;font-size:clamp(19px,2.8vh,22px);cursor:pointer}
.btns button.p{background:#e0e0e0;color:#111;border:none;font-weight:700}
</style>
</head>

/* ---------- STATE ---------- */
const app=document.getElementById('app');
let setup={mode:'read',count:15};
let quiz=null;

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- VIEWS ---------- */
function home(){
  app.innerHTML=`
  <div class="home">
    <div><h1 class="title">Xush Kelibsiz</h1></div>
    <p class="sub">Kanjilarni O'rganing va Bilimingizni Tekshiring</p>
    <div class="big" onclick="dict()"><div class="ic">${IC.book}</div><h2>Ma'lumotnoma</h2><div class="jp">辞書</div></div>
    <div class="big" onclick="setupView()"><div class="ic">${IC.pen}</div><h2>Test Ishlash</h2><div class="jp">テスト</div></div>
  </div>`;
}

function dict(){
  app.innerHTML=`
  <div class="top" onclick="home()">${IC.back}<span>Ortga</span></div>
  <div class="grid">${D.map((d,i)=>`<div class="cell jp" onclick="detail(${i})">${d.k}</div>`).join('')}</div>`;
}

function detail(i){
  const n=D.length,d=D[i];
  app.innerHTML=`
  <div class="top" onclick="dict()">${IC.back}<span>Ortga</span></div>
  <div class="det" id="det">
    <div class="dnav">
      <div class="nav" onclick="detail(${(i-1+n)%n})">${IC.back}</div>
      <div class="cnt2">${i+1} / ${n}</div>
      <div class="nav r" onclick="detail(${(i+1)%n})">${IC.back}</div>
    </div>
    <div class="bigk jp">${d.k}</div>
    <div class="mean">${d.m}</div>
    <div class="row">
      <div class="box"><small>Onyomi</small><div class="jp">${d.on.join('、')||'—'}</div></div>
      <div class="box"><small>Kunyomi</small><div class="jp">${d.kun.join('、')||'—'}</div></div>
    </div>
    <div class="wt">Muhim so'zlar</div>
    <div class="words">${d.w.map(w=>`<div class="word"><div class="w jp">${w[0]}</div><div class="d"><span class="rd">${w[1]}</span><span class="mm">${w[2]}</span></div></div>`).join('')}</div>
  </div>`;
  /* o'ngga/chapga surish bilan ham almashtirish mumkin */
  const el=document.getElementById('det');let sx=null;
  el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
  el.addEventListener('touchend',e=>{
    if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;
    if(Math.abs(dx)>60)detail(dx<0?(i+1)%n:(i-1+n)%n);
  });
}

function setupView(){
  const modes=[['read',"Kanji: O'qilishi",IC.read],['mean',"Kanji: Ma'nosi",IC.bulb],['mix','Aralash Rejim',IC.shuf]];
  const counts=[15,30,60,0];
  app.innerHTML=`
  <div class="top" onclick="home()">${IC.back}<span>Ortga</span></div>
  <div class="wrap">
    <div>
      <div class="label">Rejim</div>
      ${modes.map(m=>`<div class="mode ${setup.mode===m[0]?'on':''}" onclick="setup.mode='${m[0]}';setupView()"><div class="mi">${m[2]}</div><span>${m[1]}</span></div>`).join('')}
    </div>
    <div>
      <div class="label">Savollar Soni</div>
      <div class="counts">${counts.map(c=>`<div class="cnt ${setup.count===c?'on':''}" onclick="setup.count=${c};setupView()">${c||'Barchasi'}</div>`).join('')}</div>
    </div>
    <button class="start" onclick="startQuiz()">Testni Boshlash</button>
  </div>`;
}

/* ---------- QUIZ ---------- */
function buildQuestion(d,type){
  let correct,pool,get;
  if(type==='read'){
    correct=d.on.join(', ');
    pool=shuffle(D).filter(x=>x!==d&&!x.on.some(o=>d.on.includes(o)));
    get=x=>x.on.join(', ');
  }else{
    correct=d.m;
    pool=shuffle(D).filter(x=>x!==d&&x.m!==d.m);
    get=x=>x.m;
  }
  const wrong=[];
  for(const x of pool){const s=get(x);if(s!==correct&&!wrong.includes(s))wrong.push(s);if(wrong.length===3)break}
  return {d,type,correct,opts:shuffle([correct,...wrong])};
}

function startQuiz(){
  const n=setup.count||D.length;
  let pool=[];
  while(pool.length<n)pool=pool.concat(shuffle(D));
  pool=pool.slice(0,n);
  const qs=pool.map(d=>{
    const t=setup.mode==='mix'?(Math.random()<.5?'read':'mean'):setup.mode;
    return buildQuestion(d,t);
  });
  quiz={qs,i:0,score:0,wrong:[],answered:false};
  renderQ();
}

function renderQ(){
  const q=quiz.qs[quiz.i],n=quiz.qs.length;
  const L=['A','B','C','D'];
  app.innerHTML=`
  <div class="top" onclick="home()">${IC.back}<span>Chiqish</span></div>
  <div class="qtop">
    <div class="prog"><div class="bar"><i style="width:${(quiz.i+1)/n*100}%"></i></div><div class="cn">${quiz.i+1} / ${n}</div></div>
    <div class="score">${IC.check}<span>${quiz.score}</span></div>
  </div>
  <div class="q">
    <div class="qp">${q.type==='read'?"Onyomi O'qilishini Tanlang":"To'g'ri Ma'nosini Tanlang"}</div>
    <div class="qk jp">${q.d.k}</div>
    <div class="opts">${q.opts.map((o,j)=>`<div class="opt ${q.type==='read'?'jp':''}" id="o${j}" onclick="answer(${j})"><div class="l">${L[j]}</div><span>${o}</span></div>`).join('')}</div>
    <button class="next" id="nx" onclick="nextQ()">Keyingisi</button>
  </div>`;
  quiz.answered=false;
}

function answer(j){
  if(quiz.answered)return;
  quiz.answered=true;
  const q=quiz.qs[quiz.i];
  const ci=q.opts.indexOf(q.correct);
  q.opts.forEach((_,x)=>{
    const el=document.getElementById('o'+x);
    el.classList.add('lock');
    if(x===ci)el.classList.add('ok');
    else if(x===j)el.classList.add('no');
    else el.classList.add('dim');
  });
  if(j===ci){quiz.score++;document.querySelector('.score span').textContent=quiz.score}
  else quiz.wrong.push(q);
  const nx=document.getElementById('nx');
  nx.textContent=quiz.i===quiz.qs.length-1?"Natijani ko'rish":'Keyingisi';
  nx.classList.add('show');
}

function nextQ(){
  if(quiz.i===quiz.qs.length-1)return result();
  quiz.i++;renderQ();
}

function result(){
  const n=quiz.qs.length,p=Math.round(quiz.score/n*100);
  const msg=p>=90?'Ajoyib natija!':p>=70?'Yaxshi, davom eting!':p>=50?'Yomon emas, yana mashq qiling':"Ma'lumotnomani qayta ko'rib chiqing";
  const seen=new Set();
  const mist=quiz.wrong.filter(q=>{if(seen.has(q.d.k))return false;seen.add(q.d.k);return true});
  app.innerHTML=`
  <div class="res">
    <div class="ring" style="--p:${p}"><div><b>${p}%</b><span style="color:var(--dim)">${quiz.score} / ${n}</span></div></div>
    <div><h2>${msg}</h2><p>To'g'ri: ${quiz.score} ta · Xato: ${n-quiz.score} ta</p></div>
    <div class="mist">${mist.length?`<div class="label">Xato qilgan kanjilar</div><div class="chips">${mist.map(q=>`<div class="chip jp" onclick="detail(${D.indexOf(q.d)})">${q.d.k}</div>`).join('')}</div>`:''}</div>
    <div class="btns"><button onclick="home()">Bosh sahifa</button><button class="p" onclick="startQuiz()">Qayta urinish</button></div>
  </div>`;
}

home();
</script>
